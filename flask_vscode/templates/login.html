<!-- templates/login.html-->

<html>

<head>
    <title>Heandling of html get and post request</title>
    <style>
        div{
            width: 400px;
            border: 1px solide green;
            padding: 10px;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <div>
<!-- url_for will  route the form request to
 apropriate function that user made to handle it.-->
 <!-- we will Retrieve submitted values of inputs
  on the backend side using 'name' field of form. -->
        <h1>Handle Get Request</h1>
        <form method="GET"
        action="{{url_for('handle_get')}}">
        <input type="text"
        name="username"
        placeholder="username">
        <input type="password"
        name = "password"
        placeholder="password">
        <button type="submit">submit</button>
    
    </form>
    </div>

    <div>
        <h1>Handle Post Request</h1>
        <form method="POST"
        action="{{url_for('handle_post')}}">
        <input type="text"
        name="username"
        placeholder="username">
        <input type="password"
        name = "password"
        placeholder="password">
        <button type="submit">submit</button>
    </form>    
    </div>
</body>

</html>
